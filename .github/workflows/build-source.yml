name: Build cleaned Odyssey Greek source

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_source.py'
      - 'tests/**'
      - '.github/workflows/build-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_source.py'
      - 'tests/**'
      - '.github/workflows/build-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run source-patch tests
        run: python -m unittest discover -s tests -v
      - name: Download, clean, validate and segment
        shell: bash
        run: |
          set +e
          python -u tools/build_source.py 2>&1 | tee build-diagnostic.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ -f source/original/odyssey_perseus_grc2.xml ]; then
            python - <<'PY' >> build-diagnostic.log 2>&1
          import collections
          import xml.etree.ElementTree as ET
          ns='{http://www.tei-c.org/ns/1.0}'
          root=ET.parse('source/original/odyssey_perseus_grc2.xml').getroot()
          edition=root.find(f'.//{ns}div[@type="edition"]')
          print('RAW XML LINE-ID ANOMALIES')
          for b in edition.findall(f'./{ns}div[@subtype="book"]'):
              bn=int(b.attrib['n'])
              nums=[int(x.attrib['n']) for x in b.iter(f'{ns}l')]
              missing=sorted(set(range(1,max(nums)+1))-set(nums))
              duplicates=sorted(n for n,c in collections.Counter(nums).items() if c>1)
              descending=[(a,z) for a,z in zip(nums,nums[1:]) if z<=a]
              if missing or duplicates or descending or nums != sorted(nums):
                  print({'book':bn,'count':len(nums),'min':min(nums),'max':max(nums),'missing':missing,'duplicates':duplicates,'non_increasing':descending})
          PY
            cat build-diagnostic.log
          fi
          exit "$status"
      - name: Persist failed build diagnostic
        if: failure() && github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-diagnostic.log
          git commit -m 'Record source build diagnostic' || true
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify generated package
        run: |
          test "$(find source/books -type f | wc -l)" -eq 24
          test "$(find source/lines -type f | wc -l)" -eq 24
          test -s source/manifest.tsv
          test -s source/SOURCE_PATCHES.md
          python - <<'PY'
          import json
          d=json.load(open('source/source_build.json'))
          assert d['books']==24
          assert d['verse_lines']==12110
          assert d['segments']>24
          assert len(d['source_patches'])==3
          print(d)
          PY
      - name: Commit generated source files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build cleaned and segmented Greek source'
            git push
          fi
